    <meta property="og:image:secure_url" content="https://hichamion.github.io/aemmah/og-image.jpg?v=4" />

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <!-- Installed on the iPhone home screen: full screen, app name under the icon -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="أئمة" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Andalusi title font: the visitor's installed "Andalus" (Windows) or public/fonts/andalusi.woff2. */
      @font-face {
        font-family: 'AemmahAndalusi';
        src: local('Andalus'), local('Andalus Regular'), url('fonts/andalusi.woff2') format('woff2');
        font-display: swap;
      }
    </style>
    <script>
      // Applies the saved theme before the first paint (see src/lib/settings.ts).
      try {
        var s = JSON.parse(localStorage.getItem('aemmah-settings') || '{}');
        var t = s.theme || 'light';
        if (t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#0d1520] text-slate-800 antialiased font-sans">
    <noscript>يحتاج هذا الموقع إلى تفعيل JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
